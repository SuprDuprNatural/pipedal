name: CMake

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [ main ]
    
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:

    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: vite/package-lock.json

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libnm-dev liblilv-dev libboost-dev \
          libjack-jackd2-dev libnl-3-dev libnl-genl-3-dev libsystemd-dev \
          catch libasound2-dev libwebsocketpp-dev authbind libsdbus-c++-dev \
          libsdbus-c++-bin libavahi-client-dev libzip-dev libicu-dev apt \
          libpipewire-0.3-dev libssl-dev librsvg2-dev
        npm ci --prefix vite

    - name: Frontend and portable regression checks
      run: |
        npm run lint --prefix vite
        node vite/test/preset-save.mjs
        node vite/test/oled-artwork.mjs
        node vite/test/knob-drag.mjs
        python3 test/preset_save_regression.py
        python3 test/oled_regression.py
        python3 test/gpio_preset_cooldown.py

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
      env:
           CC:   gcc-13
           CXX:  g++-13
    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
      env:
         CC:   gcc-13
         CXX:  g++-13
    - name: Native regression checks
      run: |
        ctest --test-dir build --output-on-failure --timeout 120 -R '^(BuildTest|jsonTest|LatencyCompensation)$'
        build/src/pipedaltest "[gpio]"
    - name: Make Package
      run: ./makePackage.sh
       
    - name: Generate Artifacts
      uses: actions/upload-artifact@v7
      with:
          name: artifact
          path: |
              build/*.deb
          retention-days: 5
             
