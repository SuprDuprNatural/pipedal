<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>T3K Response</title>
        <script>
        function returnResponse() {
            if (!window.opener) {
                window.close();
                return;
            }
            window.opener.postMessage(
                {
                    type: "t3k_response",
                    uri: window.location.href
                }, window.location.origin
            );
            window.close();
        }
        </script>
    </head>
    <body style="background: #000000" onload="returnResponse()"></body>
</html>
